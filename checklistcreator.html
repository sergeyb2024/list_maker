<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; background: white; }
        .tab-inactive { color: #64748b; background: #f1f5f9; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <div class="bg-slate-900 text-white p-3 flex justify-between items-center shadow-md z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center shadow-lg">
                <i class="fas fa-clipboard-check text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide">Checklist Creator</h1>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="saveProject()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-xs border border-slate-600 transition flex items-center gap-2">
                <i class="fas fa-save"></i> Save Designer File
            </button>
            <label class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-xs border border-slate-600 cursor-pointer transition flex items-center gap-2">
                <i class="fas fa-folder-open"></i> Load
                <input type="file" id="projectLoader" class="hidden" onchange="loadProject(this)" accept=".json">
            </label>
            <div class="h-8 w-px bg-slate-700 mx-2"></div>
            <button onclick="exportChecklist()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded font-bold shadow-lg transition flex items-center gap-2 text-sm">
                <i class="fas fa-rocket"></i> EXPORT FINAL APP
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        
        <div class="w-80 bg-white shadow-xl flex flex-col z-10 border-r border-slate-200 overflow-y-auto">
            
            <div class="p-5 border-b border-slate-100">
                <h2 class="text-xs font-bold text-blue-600 uppercase mb-3 tracking-wider"><i class="fas fa-cog mr-1"></i> Project Settings</h2>
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Checklist Name</label>
                    <input type="text" id="app-title" class="w-full text-sm p-2 border border-slate-300 rounded focus:border-blue-500 outline-none" placeholder="e.g. Daily Inspection" oninput="updateMeta()">
                </div>
                
                <div class="bg-slate-50 p-3 rounded border border-slate-200">
                    <label class="block text-xs font-bold text-slate-600 mb-2">Personnel / Staff List</label>
                    <div class="flex gap-1 mb-2">
                        <input type="text" id="new-person" class="w-full text-xs p-2 border rounded" placeholder="Add Name (e.g. John)">
                        <button onclick="addPerson()" class="bg-blue-600 text-white px-3 rounded hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="personnel-list" class="flex flex-wrap gap-1">
                        </div>
                    <p class="text-[10px] text-slate-400 mt-2 leading-tight">These names will appear in the dropdown for signature timestamps.</p>
                </div>
            </div>

            <div class="p-5">
                <h2 class="text-xs font-bold text-blue-600 uppercase mb-3 tracking-wider"><i class="fas fa-tools mr-1"></i> Toolbox</h2>
                <div class="space-y-3">
                    <button onclick="addField('text')" class="w-full text-left p-3 bg-white hover:bg-blue-50 text-slate-600 hover:text-blue-700 rounded border border-slate-200 shadow-sm hover:shadow transition flex items-center gap-3 text-sm group">
                        <div class="w-8 h-8 rounded bg-blue-100 text-blue-500 flex items-center justify-center group-hover:bg-blue-200 transition"><i class="fas fa-font"></i></div>
                        <div>
                            <span class="font-bold block">Text Input</span>
                            <span class="text-[10px] text-slate-400">Data entry + Verify</span>
                        </div>
                    </button>

                    <button onclick="addField('multi')" class="w-full text-left p-3 bg-white hover:bg-purple-50 text-slate-600 hover:text-purple-700 rounded border border-slate-200 shadow-sm hover:shadow transition flex items-center gap-3 text-sm group">
                        <div class="w-8 h-8 rounded bg-purple-100 text-purple-500 flex items-center justify-center group-hover:bg-purple-200 transition"><i class="fas fa-list-check"></i></div>
                        <div>
                            <span class="font-bold block">Multi-Item Group</span>
                            <span class="text-[10px] text-slate-400">List with individual checks</span>
                        </div>
                    </button>

                    <button onclick="addField('textarea')" class="w-full text-left p-3 bg-white hover:bg-orange-50 text-slate-600 hover:text-orange-700 rounded border border-slate-200 shadow-sm hover:shadow transition flex items-center gap-3 text-sm group">
                        <div class="w-8 h-8 rounded bg-orange-100 text-orange-500 flex items-center justify-center group-hover:bg-orange-200 transition"><i class="fas fa-align-left"></i></div>
                        <div>
                            <span class="font-bold block">Notes / Area</span>
                            <span class="text-[10px] text-slate-400">Large text block</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-slate-100">
            
            <div class="bg-white border-b border-slate-200 px-4 pt-4 flex items-center gap-1 overflow-x-auto shadow-sm z-10" id="tabs-container">
                </div>

            <div class="flex-1 overflow-y-auto p-8 relative">
                <div id="canvas" class="max-w-4xl mx-auto space-y-6 pb-32">
                    </div>
                
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-50">
                    <div class="w-24 h-24 bg-slate-200 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-layer-group text-4xl text-slate-400"></i>
                    </div>
                    <p class="text-slate-500 font-medium">Select a Tab and add items from the toolbox.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA STATE ---
        let projectData = {
            title: "Operational Checklist",
            personnel: [], // Array of names
            tabs: [{ id: 'tab-1', name: 'Start Here' }],
            fields: []
        };

        let activeTabId = 'tab-1';

        // --- INITIALIZATION ---
        function renderAll() {
            document.getElementById('app-title').value = projectData.title;
            renderPersonnel();
            renderTabs();
            renderCanvas();
        }

        function updateMeta() {
            projectData.title = document.getElementById('app-title').value;
        }

        // --- PERSONNEL LOGIC ---
        function addPerson() {
            const input = document.getElementById('new-person');
            const name = input.value.trim();
            if(name && !projectData.personnel.includes(name)) {
                projectData.personnel.push(name);
                input.value = '';
                renderPersonnel();
            }
        }

        function removePerson(name) {
            projectData.personnel = projectData.personnel.filter(p => p !== name);
            renderPersonnel();
        }

        function renderPersonnel() {
            const container = document.getElementById('personnel-list');
            container.innerHTML = projectData.personnel.map(p => `
                <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-1 rounded-full flex items-center gap-1">
                    ${p} <i onclick="removePerson('${p}')" class="fas fa-times cursor-pointer hover:text-red-500"></i>
                </span>
            `).join('');
        }

        // --- TABS LOGIC ---
        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            projectData.tabs.forEach(tab => {
                const isActive = tab.id === activeTabId;
                const btn = document.createElement('div');
                btn.className = `cursor-pointer px-6 py-3 text-sm rounded-t border-t border-r border-l transition flex items-center gap-2 group select-none ${isActive ? 'tab-active border-slate-300 shadow-sm' : 'tab-inactive border-transparent hover:bg-slate-200'}`;
                btn.innerHTML = `
                    <span onclick="switchTab('${tab.id}')" class="font-medium">${tab.name}</span>
                    <i onclick="renameTab('${tab.id}')" class="fas fa-pen text-[10px] text-slate-400 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition"></i>
                    ${projectData.tabs.length > 1 ? `<i onclick="deleteTab('${tab.id}')" class="fas fa-times text-[10px] text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"></i>` : ''}
                `;
                container.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "px-3 py-2 text-slate-400 hover:text-blue-600 transition";
            addBtn.innerHTML = "<i class='fas fa-plus-circle text-xl'></i>";
            addBtn.onclick = addNewTab;
            container.appendChild(addBtn);
        }

        function addNewTab() {
            const id = 'tab-' + Math.random().toString(36).substr(2, 9);
            projectData.tabs.push({ id: id, name: 'New Section' });
            activeTabId = id;
            renderAll();
        }

        function switchTab(id) { activeTabId = id; renderAll(); }

        function renameTab(id) {
            const tab = projectData.tabs.find(t => t.id === id);
            const newName = prompt("Rename Tab:", tab.name);
            if(newName) { tab.name = newName; renderTabs(); }
        }

        function deleteTab(id) {
            if(!confirm("Delete tab?")) return;
            projectData.tabs = projectData.tabs.filter(t => t.id !== id);
            projectData.fields = projectData.fields.filter(f => f.tabId !== id);
            if(activeTabId === id) activeTabId = projectData.tabs[0]?.id || null;
            renderAll();
        }

        // --- FIELD LOGIC ---
        function addField(type) {
            if(!activeTabId) { alert("Add a tab first!"); return; }
            const newField = {
                id: Math.random().toString(36).substr(2, 9),
                tabId: activeTabId,
                type: type,
                label: type === 'multi' ? 'Checklist Group' : 'Field Name',
                width: 'w-full',
                items: type === 'multi' ? 'Item 1, Item 2, Item 3' : '', // For multi list
                value: '', 
                verification: null // Will store { user, time }
            };
            projectData.fields.push(newField);
            renderCanvas();
        }

        function renderCanvas() {
            const container = document.getElementById('canvas');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';
            const tabFields = projectData.fields.filter(f => f.tabId === activeTabId);
            
            if(tabFields.length > 0) emptyState.style.display = 'none';
            else emptyState.style.display = 'flex';

            tabFields.forEach((field, index) => {
                const el = document.createElement('div');
                el.className = `relative bg-white p-5 rounded-lg shadow-sm border border-slate-200 group ${field.width}`;
                
                let contentHTML = '';
                
                if(field.type === 'multi') {
                    contentHTML = `
                        <div class="mt-3 bg-purple-50 p-3 rounded border border-purple-100">
                            <label class="text-[10px] font-bold text-purple-600 uppercase">Checklist Items (Comma Separated)</label>
                            <textarea class="w-full text-xs p-2 border rounded mt-1 focus:ring-1 ring-purple-500 outline-none" 
                                oninput="updateField('${field.id}', 'items', this.value)">${field.items}</textarea>
                            <div class="mt-2 flex flex-col gap-1 opacity-60">
                                <div class="flex items-center gap-2"><input type="checkbox" disabled> <span class="text-xs italic">Item 1 [ ] (Verified by...)</span></div>
                                <div class="flex items-center gap-2"><input type="checkbox" disabled> <span class="text-xs italic">Item 2 [ ] (Verified by...)</span></div>
                            </div>
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="mt-3 h-10 bg-slate-50 border border-dashed border-slate-300 rounded flex items-center px-3 text-xs text-slate-400">
                            User Input Field + Verification Button
                        </div>
                    `;
                }

                el.innerHTML = `
                    <div class="absolute top-4 right-4 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                        <button onclick="moveField('${field.id}', -1)" class="w-6 h-6 bg-slate-100 hover:bg-blue-100 text-slate-500 rounded flex items-center justify-center"><i class="fas fa-arrow-up text-xs"></i></button>
                        <button onclick="moveField('${field.id}', 1)" class="w-6 h-6 bg-slate-100 hover:bg-blue-100 text-slate-500 rounded flex items-center justify-center"><i class="fas fa-arrow-down text-xs"></i></button>
                        <button onclick="removeField('${field.id}')" class="w-6 h-6 bg-slate-100 hover:bg-red-100 text-slate-500 hover:text-red-500 rounded flex items-center justify-center"><i class="fas fa-trash text-xs"></i></button>
                    </div>

                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Label / Question</label>
                            <input type="text" class="w-full font-bold text-slate-700 border-b border-transparent hover:border-slate-300 focus:border-blue-500 outline-none text-lg transition" 
                                value="${field.label}" oninput="updateField('${field.id}', 'label', this.value)">
                            
                            ${contentHTML}
                        </div>
                    </div>
                    
                    <div class="mt-3 flex items-center gap-2">
                         <label class="text-[10px] font-bold text-slate-400 uppercase">Width:</label>
                         <select onchange="updateField('${field.id}', 'width', this.value); renderCanvas()" class="text-xs bg-slate-100 border-none rounded py-1 px-2">
                            <option value="w-full" ${field.width === 'w-full' ? 'selected' : ''}>Full</option>
                            <option value="w-1/2" ${field.width === 'w-1/2' ? 'selected' : ''}>Half</option>
                        </select>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function updateField(id, key, val) {
            const f = projectData.fields.find(x => x.id === id);
            if(f) f[key] = val;
        }

        function removeField(id) {
            projectData.fields = projectData.fields.filter(f => f.id !== id);
            renderCanvas();
        }

        function moveField(id, dir) {
            const idx = projectData.fields.findIndex(f => f.id === id);
            const target = idx + dir;
            if(target >= 0 && target < projectData.fields.length) {
                [projectData.fields[idx], projectData.fields[target]] = [projectData.fields[target], projectData.fields[idx]];
                renderCanvas();
            }
        }

        // --- SAVE / LOAD PROJECT ---
        function saveProject() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectData));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "checklist_project_v4.json";
            document.body.appendChild(a); a.click(); a.remove();
        }
        function loadProject(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) { projectData = JSON.parse(e.target.result); activeTabId = projectData.tabs[0]?.id; renderAll(); };
            reader.readAsText(file);
        }

        // --- EXPORT FINAL APP ---
        function exportChecklist() {
            if(projectData.personnel.length === 0) {
                if(!confirm("Warning: You haven't added any Personnel names. Users won't be able to sign off. Continue anyway?")) return;
            }

            const dataString = JSON.stringify(projectData).replace(/"/g, '&quot;');
            
            const html = `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${projectData.title}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .tab-section { display: block !important; page-break-inside: avoid; border-bottom: 2px solid #000; margin-bottom: 20px; }
            .verify-box { border: 1px solid #000 !important; color: black !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20 font-sans">

    <div class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto p-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">${projectData.title}</h1>
                <div class="text-xs text-slate-400" id="status-bar">Not started</div>
            </div>
            
            <div class="no-print flex items-center gap-4 bg-slate-800 p-2 rounded-lg border border-slate-700">
                <div class="flex flex-col text-right">
                    <span class="text-[10px] uppercase font-bold text-slate-400">I am currently working as:</span>
                    <select id="active-user" class="bg-transparent font-bold text-yellow-400 outline-none text-sm cursor-pointer">
                        <option value="">-- Select Your Name --</option>
                        ${projectData.personnel.map(p => `<option value="${p}">${p}</option>`).join('')}
                    </select>
                </div>
                <div class="w-px h-8 bg-slate-600"></div>
                <div class="flex gap-2">
                     <button onclick="saveData()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-xs"><i class="fas fa-save"></i> Save</button>
                     <input type="file" id="loadInput" class="hidden" onchange="loadData(this)">
                     <button onclick="document.getElementById('loadInput').click()" class="bg-slate-600 hover:bg-slate-500 text-white px-3 py-2 rounded text-xs"><i class="fas fa-upload"></i> Load</button>
                     <button onclick="window.print()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded text-xs"><i class="fas fa-print"></i> PDF</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto mt-6 bg-white rounded shadow-xl overflow-hidden min-h-[600px]">
        
        <div class="flex bg-slate-100 border-b overflow-x-auto no-print" id="tab-header"></div>

        <div class="p-8" id="form-body"></div>

    </div>

    <script>
        let data = JSON.parse("${dataString}".replace(/&quot;/g, '"'));
        let activeTab = data.tabs[0].id;
        
        // Ensure complex data structures exist for fields
        data.fields.forEach(f => {
            if(!f.verification) f.verification = null; // Single item verification
            if(f.type === 'multi' && !f.multiVerification) f.multiVerification = {}; // Multi item map { "Item Name": {user, time} }
        });

        function renderApp() {
            const tabsEl = document.getElementById('tab-header');
            const formEl = document.getElementById('form-body');
            
            // RENDER TABS
            tabsEl.innerHTML = data.tabs.map(t => \`
                <button onclick="activeTab = '\${t.id}'; renderApp()" 
                    class="px-6 py-3 text-sm font-bold transition border-r \${t.id === activeTab ? 'bg-white text-blue-600 border-t-4 border-t-blue-600' : 'text-slate-500 hover:bg-slate-200'}">
                    \${t.name}
                </button>
            \`).join('');

            // RENDER FIELDS
            formEl.innerHTML = '';

            data.tabs.forEach(tab => {
                // Wrapper for Print (shows all) vs Screen (shows active)
                const section = document.createElement('div');
                section.className = \`tab-section \${tab.id === activeTab ? '' : 'hidden no-print'}\`;
                section.innerHTML = \`<h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">\${tab.name}</h2>\`;

                const grid = document.createElement('div');
                grid.className = "flex flex-wrap -mx-3";

                const fields = data.fields.filter(f => f.tabId === tab.id);
                if(fields.length === 0) grid.innerHTML = '<div class="w-full text-center italic text-slate-400 py-10">No items required for this section.</div>';

                fields.forEach(field => {
                    const col = document.createElement('div');
                    col.className = field.width === 'w-full' ? 'w-full px-3 mb-6' : 'w-1/2 px-3 mb-6';
                    
                    // ------------------------------------------------
                    // 1. MULTI-ITEM LIST LOGIC
                    // ------------------------------------------------
                    if(field.type === 'multi') {
                        const items = field.items.split(',').map(i => i.trim()).filter(i => i);
                        let listHtml = items.map((item, idx) => {
                            // Check if verified
                            const verifyData = field.multiVerification[item];
                            const isDone = !!verifyData;

                            return \`
                                <div class="flex items-center justify-between p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition">
                                    <span class="text-sm font-medium text-slate-700">\${item}</span>
                                    
                                    <button onclick="toggleMultiVerify('\${field.id}', '\${item}')" 
                                            class="flex items-center gap-2 px-3 py-1 rounded border transition \${isDone ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-slate-300 text-slate-400 hover:border-blue-400'}">
                                        <i class="fas \${isDone ? 'fa-check-square' : 'fa-square'}"></i>
                                        <div class="flex flex-col text-right leading-tight">
                                            <span class="text-[10px] font-bold uppercase">\${isDone ? 'Confirmed' : 'Verify'}</span>
                                            \${isDone ? \`<span class="text-[9px] opacity-75">\${verifyData.user} <br> \${verifyData.time}</span>\` : ''}
                                        </div>
                                    </button>
                                </div>
                            \`;
                        }).join('');

                        col.innerHTML = \`
                            <div class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden">
                                <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex justify-between items-center">
                                    <span class="font-bold text-slate-700 uppercase text-xs">\${field.label}</span>
                                    <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">Group</span>
                                </div>
                                <div>\${listHtml}</div>
                            </div>
                        \`;
                    } 
                    // ------------------------------------------------
                    // 2. SINGLE TEXT / AREA LOGIC
                    // ------------------------------------------------
                    else {
                        // Verification State
                        const isDone = !!field.verification;
                        const verifyData = field.verification || {};

                        let inputHtml = '';
                        if(field.type === 'textarea') {
                            inputHtml = \`<textarea class="w-full p-2 bg-slate-50 border-t border-b border-slate-200 focus:bg-white outline-none text-sm h-24" oninput="updateVal('\${field.id}', this.value)">\${field.value || ''}</textarea>\`;
                        } else {
                            inputHtml = \`<input type="text" class="w-full p-2 bg-slate-50 border-t border-b border-slate-200 focus:bg-white outline-none text-sm" value="\${field.value || ''}" oninput="updateVal('\${field.id}', this.value)">\`;
                        }

                        col.innerHTML = \`
                             <div class="border border-slate-200 rounded-lg overflow-hidden shadow-sm bg-white">
                                <div class="px-3 py-2 bg-white flex justify-between items-center">
                                    <label class="text-xs font-bold text-slate-500 uppercase">\${field.label}</label>
                                </div>
                                \${inputHtml}
                                <div class="bg-slate-50 p-2 flex justify-end border-t border-slate-100">
                                     <button onclick="toggleSingleVerify('\${field.id}')" 
                                            class="flex items-center gap-3 px-4 py-1.5 rounded border transition w-full md:w-auto justify-center \${isDone ? 'bg-green-600 text-white border-green-600' : 'bg-white border-slate-300 text-slate-500 hover:border-blue-500 hover:text-blue-600'}">
                                        <i class="fas \${isDone ? 'fa-check-circle' : 'fa-circle'}"></i>
                                        <div class="text-left leading-none">
                                            <div class="text-xs font-bold uppercase">\${isDone ? 'Signed Off' : 'Click to Sign'}</div>

        // --- INTERACTION LOGIC ---

        function getUser() {
            const user = document.getElementById('active-user').value;
            if(!user) {
                alert("⚠️ ACTION REQUIRED: Please select your name at the top of the screen before signing off items.");
                // Scroll to top
                window.scrollTo({top: 0, behavior: 'smooth'});
                return null;
            }
            return user;
        }

        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' ' + now.toLocaleDateString();
        }

        function toggleSingleVerify(id) {
            const user = getUser();
            if(!user) return;

            const f = data.fields.find(x => x.id === id);
            if(f) {
                if(f.verification) {
                    // Optional: Uncheck allowed? Let's say yes but confirm.
                    if(confirm("Remove signature for this item?")) f.verification = null;
                } else {
                    f.verification = { user: user, time: getTime() };
                }
                renderApp();
            }
        }

        function toggleMultiVerify(id, itemName) {
            const user = getUser();
            if(!user) return;

            const f = data.fields.find(x => x.id === id);
            if(f) {
                if(!f.multiVerification) f.multiVerification = {};
                
                if(f.multiVerification[itemName]) {
                    // Toggle Off
                     if(confirm("Remove signature for " + itemName + "?")) delete f.multiVerification[itemName];
                } else {
                    // Toggle On
                    f.multiVerification[itemName] = { user: user, time: getTime() };
                }
                renderApp();
            }
        }

        function updateVal(id, val) {
            const f = data.fields.find(x => x.id === id);
            if(f) f.value = val;
        }

        // --- FILE I/O ---
        function saveData() {
            const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'checklist_status.json';
            document.body.appendChild(a); a.click(); a.remove();
        }

        function loadData(input) {
            const f = input.files[0];
            if(!f) return;
            const r = new FileReader();
            r.onload = e => { data = JSON.parse(e.target.result); renderApp(); };
            r.readAsText(f);
        }

        window.onload = renderApp;
