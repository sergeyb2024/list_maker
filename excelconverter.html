<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Interactive Web Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>

    <style>
        /* Custom Styles for the workspace */
        body { padding: 20px; background-color: #f4f4f9; }
        .tab-content { background: white; padding: 20px; border: 1px solid #dee2e6; border-top: none; }
        .interactive-row { transition: background 0.2s; }
        .interactive-row:hover { background-color: #f8f9fa; }
        
        /* Styles for the EXPORTED file (these are injected into the download) */
        .export-hidden { display: none !important; }
        .note-area { width: 100%; margin-top: 5px; border: 1px solid #ccc; background: #fffdf0; font-family: monospace; }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <h2 class="mb-4">Excel to Interactive Checklist Converter</h2>

    <div class="card p-4 mb-4 controls-area">
        <div class="row">
            <div class="col-md-6">
                <label class="form-label"><strong>Step 1: Upload Excel (.xlsx)</strong></label>
                <input type="file" id="upload" class="form-control" accept=".xlsx, .xls" />
            </div>
            <div class="col-md-6 text-end align-self-end">
                <button onclick="exportPage()" class="btn btn-success">💾 Save as New Webpage</button>
            </div>
        </div>
        <div class="mt-3">
            <small class="text-muted">Tools (Click a row below, then click a tool):</small><br>
            <button onclick="addCheckbox()" class="btn btn-sm btn-outline-primary">Add Checkbox</button>
            <button onclick="addNote()" class="btn btn-sm btn-outline-warning">Add Note Area</button>
            <button onclick="addDropdown()" class="btn btn-sm btn-outline-secondary">Add Status Dropdown</button>
        </div>
    </div>

    <div id="workbook-view">
        <ul class="nav nav-tabs" id="sheetTabs" role="tablist"></ul>
        <div class="tab-content" id="sheetContent"></div>
    </div>
</div>

<script>
    let selectedRow = null;

    // 1. Handle File Upload
    document.getElementById('upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            renderWorkbook(workbook);
        };
        
        reader.readAsArrayBuffer(file);
    });

    // 2. Render Excel Data to HTML
    function renderWorkbook(workbook) {
        const tabsContainer = document.getElementById('sheetTabs');
        const contentContainer = document.getElementById('sheetContent');
        
        tabsContainer.innerHTML = '';
        contentContainer.innerHTML = '';

        workbook.SheetNames.forEach((sheetName, index) => {
            // Create Tab
            const tabId = `tab-${index}`;
            const isActive = index === 0 ? 'active' : '';
            
            tabsContainer.innerHTML += `
                <li class="nav-item" role="presentation">
                    <button class="nav-link ${isActive}" id="${tabId}-btn" data-bs-toggle="tab" data-bs-target="#${tabId}" type="button" role="tab">${sheetName}</button>
                </li>`;

            // Create Content
            const sheet = workbook.Sheets[sheetName];
            const jsonData = XLSX.utils.sheet_to_json(sheet, {header: 1}); // Array of Arrays
            
            let tableHTML = '<table class="table table-bordered"><tbody>';
            
            jsonData.forEach((row) => {
                tableHTML += `<tr class="interactive-row" onclick="selectRow(this)">`;
                // Data Columns
                row.forEach(cell => {
                    tableHTML += `<td>${cell || ''}</td>`;
                });
                // Interaction Column placeholder
                tableHTML += `<td class="interaction-cell"></td>`;
                tableHTML += `</tr>`;
            });
            tableHTML += '</tbody></table>';

            contentContainer.innerHTML += `
                <div class="tab-pane fade show ${isActive}" id="${tabId}" role="tabpanel">
                    ${tableHTML}
                </div>`;
        });
    }

    // 3. Interaction Logic
    function selectRow(rowElem) {
        // Remove highlight from previous
        document.querySelectorAll('.interactive-row').forEach(r => r.style.border = "none");
        selectedRow = rowElem;
        selectedRow.style.border = "2px solid #0d6efd";
    }

    function addCheckbox() {
        if(!selectedRow) return alert("Select a row first!");
        const targetCell = selectedRow.querySelector('.interaction-cell');
        targetCell.insertAdjacentHTML('beforeend', '<div class="form-check"><input class="form-check-input" type="checkbox"> <label>Done</label></div>');
    }

    function addNote() {
        if(!selectedRow) return alert("Select a row first!");
        const targetCell = selectedRow.querySelector('.interaction-cell');
        targetCell.insertAdjacentHTML('beforeend', '<textarea class="note-area" placeholder="Enter notes..."></textarea>');
    }

    function addDropdown() {
        if(!selectedRow) return alert("Select a row first!");
        const targetCell = selectedRow.querySelector('.interaction-cell');
        targetCell.insertAdjacentHTML('beforeend', `
            <select class="form-select form-select-sm mt-1">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
            </select>
        `);
    }

    // 4. The Export Logic
    function exportPage() {
        // Clone the main container
        const content = document.getElementById('workbook-view').cloneNode(true);
        
        // We need to make sure the Tabs logic works in the exported file without Bootstrap JS if possible, 
        // or include the CDN links in the export.
        
        const htmlTemplate = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Exported Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; font-family: sans-serif; }
        .tab-content { padding: 20px; border: 1px solid #dee2e6; border-top: none; }
        textarea { width: 100%; background: #fffdf0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checklist Snapshot</h1>
        <p>Generated on: ${new Date().toLocaleString()}</p>
        <hr>
        ${content.innerHTML}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script>
</body>
</html>`;

        // Create Blob and Download
        const blob = new Blob([htmlTemplate], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'my_checklist.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
